<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
<link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
</head>
<body>

<table class="header" align="center">
  <tr>
    <td>
      <a href="{{ '/' | relative_url }}" class="logo">
        <span class="logo-title">{{ site.title }}</span>
        <span class="logo-tag">{{ site.tagline }}</span>
      </a>
    </td>
    <td>
      <div class="infobox">
        <b>ABOUT</b><br>
        {{ site.description }}<br>
        <span class="pink">兩位作者輪流更新中。</span>
      </div>
    </td>
  </tr>
</table>

<hr>

{{ content }}

<hr>
<p class="footer">(C) {{ site.time | date: "%Y" }} {{ site.title }} &nbsp;|&nbsp; <a href="{{ '/' | relative_url }}">TOP</a></p>

</body>
</html>
