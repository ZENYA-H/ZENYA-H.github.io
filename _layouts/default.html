<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
<link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
</head>
<body>

<div class="header">
  <div class="header-title">
    <a href="{{ '/' | relative_url }}" class="site-title">{{ site.title }}</a>
    <p class="site-tagline">{{ site.tagline }}</p>
  </div>
  <div class="infobox">
    <b>ABOUT</b><br>
    {{ site.description }}<br>
    <span class="pink">更新中。</span>
  </div>
</div>

<hr>
{% if page.heading %}
<div class="page-heading">
  <h1 class="section-title">{{ page.heading }}</h1>
  {% if page.subheading %}<p class="center yellow small">{{ page.subheading }}</p>{% endif %}
</div>
{% endif %}
<div class="stage">
  <div class="window">
    {{ content }}
  </div>
</div>

<p class="footer">(C) {{ site.time | date: "%Y" }} {{ site.title }} &nbsp;|&nbsp; <a href="{{ '/' | relative_url }}">TOP</a></p>

</body>
</html>
