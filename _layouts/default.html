<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>

<div class="header">
  <div class="header-title">
    <a href="{{ '/' | relative_url }}" class="site-title">{{ site.title }}</a>
    <p class="site-tagline">{{ site.tagline }}</p>
  </div>
  <div class="infobox">
    <b>～ABOUT～</b><br>
    {{ site.description }}<br>
    <span class="pink">2026.11 初始更新中。</span>
  </div>
</div>

<hr>
<div class="stage">
  <div class="window">
    <span id="top"></span>
    {{ content }}
    <p class="to-top"><a href="#top">▲ TOP</a></p>
  </div>
</div>

<p class="footer">(C) {{ site.time | date: "%Y" }} {{ site.title }} &nbsp;|&nbsp; <a href="{{ '/archive/' | relative_url }}">文章列表 Archive</a></p>

</body>
</html>
